<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rise of Realms — intro & clash test page</title>
<meta name="author" content="John Khan">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0a10; color: #f3efe4; font-family: Inter, system-ui, sans-serif; }
  .box { width: min(520px, calc(100% - 32px)); display: grid; gap: 12px; text-align: center; }
  h1 { font-family: Cinzel, serif; margin: 0 0 6px; }
  button { min-height: 50px; border-radius: 12px; border: 1px solid #7a4a0c; font: 800 16px Inter, sans-serif; cursor: pointer;
    background: linear-gradient(180deg, #ffe08a, #f2b93b 45%, #c8841c); color: #2b1700; }
  button.ghost { background: rgba(255,255,255,.08); color: #f3efe4; border-color: rgba(255,255,255,.15); }
  select { min-height: 44px; border-radius: 10px; background: #15131c; color: #fff; border: 1px solid #333; padding: 0 10px; font: 600 15px Inter, sans-serif; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  p { color: #9aa7bd; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Intro &amp; Clash test page</h1>
    <p>Test page for the two add-ons. It uses the real art in <code>../art/</code>. Serve the project folder (for example <code>python -m http.server</code>) and open <code>/addons/demo.html</code>.</p>
    <button id="intro">▶ Play the fighting intro</button>
    <div class="row"><select id="a"></select><select id="d"></select></div>
    <div class="row"><button id="win">Clash: attacker wins</button><button class="ghost" id="lose">Clash: defender wins</button></div>
  </div>
<script src="rr-intro.js"></script>
<script src="rr-clash.js"></script>
<script>
  const L = RRIntro.LEADERS, keys = Object.keys(L);
  for (const id of ['a', 'd']) document.getElementById(id).innerHTML = keys.map(k => `<option value="${k}">${L[k][0]}</option>`).join('');
  document.getElementById('d').value = 'genghis';
  document.getElementById('intro').onclick = () => RRIntro.play({ artPath: '../art/', onDone: () => console.log('intro done — show the menu here') });
  function clash(win) {
    const a = document.getElementById('a').value, d = document.getElementById('d').value;
    RRClash.play({
      artPath: '../art/', attackerWins: win,
      attacker: { leader: a, name: L[a][0], color: L[a][2] },
      defender: { leader: d, name: L[d][0], color: L[d][2] },
      onDone: () => console.log('clash done — show the turn report here'),
    });
  }
  document.getElementById('win').onclick = () => clash(true);
  document.getElementById('lose').onclick = () => clash(false);
</script>
</body>
</html>
